# settings.cfg — Vossberg Mobility, KM-Waechter
# Maintenance rules. Do not change without sign-off from Fleet Ops.
#
# These values are the single source of truth.  km_wachter.py reads them
# at startup; the rule constants in that file are derived from these values.

# Service scheduling rules
service_interval_km = 15000
warn_at_percent = 80

# Report settings
report_title = Vossberg Mobility - nightly fleet report
history_file = fleet_history.csv
log_file = km_wachter.log

# mileage_unit controls the distance unit in the nightly fleet report.
# Accepted values: km (default, matches odometer readings) | miles (UK partner report)
mileage_unit = km
